<style>

*,*:before,*:after{box-sizing:inherit}

@keyframes in{from{opacity:0;transform:translateY(10px)}}

.wrap{max-width:560px;margin:0 auto;padding:14px}
.bar{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800;margin-bottom:10px;letter-spacing:.04em}
.bar button{background:#ffffff33;color:#fff;border:0;border-radius:99px;padding:8px 14px;font:inherit;font-weight:700;display:flex;gap:6px;align-items:center;cursor:pointer}
.card{background:var(--card);color:var(--text);border-radius:22px;padding:22px;box-shadow:0 12px 40px #0004;animation:in .3s}
h1{margin:0 0 6px;font-size:1.9rem;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
h3{margin:22px 0 4px;color:var(--acc);text-transform:uppercase;font-size:.8rem;letter-spacing:.1em}
.m{color:var(--muted);margin:4px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;font:inherit;font-weight:700;font-size:1.05rem;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));cursor:pointer;box-shadow:0 4px 14px #0003}
.btn.alt{background:var(--in);color:var(--text);box-shadow:none;border:2px solid var(--line)}
.btn:disabled{opacity:.45}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--in);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input[type=range]{padding:0;accent-color:var(--acc)}
input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--acc)}
.row{display:flex;gap:10px;align-items:center;margin-top:10px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 4px}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.av.big{width:84px;height:84px;font-size:2.2rem;margin:14px auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.pc{display:flex;flex-direction:column;align-items:center;gap:8px;border:3px solid transparent;border-radius:16px;padding:14px 8px;background:var(--in);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.pc.sel{border-color:var(--acc);transform:scale(1.04);box-shadow:0 6px 18px #0003}
.word{font-size:2.3rem;font-weight:900;text-align:center;padding:30px 10px;border-radius:18px;margin:16px 0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;transition:filter .2s;word-break:break-word;user-select:none}
.word.hide{filter:blur(18px)}
.clock{font-size:4.2rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;color:var(--acc);margin:10px 0}
.clock.low{color:#ef4444;animation:pulse 1s infinite}

.chip.on{background:var(--acc);color:#fff;border-color:transparent}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;color:#fff;font-size:.8rem;font-weight:700}
.t-civ{background:#0284c7}.t-und{background:#d97706}.t-wht{background:#7c3aed}
.sc{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:12px;z-index:9;max-width:90%;text-align:center}
.center{text-align:center}
</style></head>
<body data-ph="home"><div class="wrap"><div class="bar"><span>MR. WHITE</span><button id="gear"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button></div><div id="app"></div></div>
<script>
"use strict";
const WORDS={
Food:"apple,orange,mango,peach,pear,lemon,cherry,grape,plum;pizza,burger,taco,sushi,kebab,curry,sandwich,wrap,noodles,pasta;coffee,tea,juice,soda,milk,smoothie,lemonade,cocoa;cake,pie,cookie,donut,brownie,pudding,muffin,waffle,pancake;bread,rice,potato,couscous,oats,quinoa,cereal,toast;chicken,beef,mutton,fish,turkey,lamb,duck,prawn",
Animals:"dog,cat,rabbit,hamster,wolf,fox,jackal,coyote;lion,tiger,leopard,cheetah,jaguar,panther,lynx;eagle,hawk,falcon,owl,vulture,crow,raven;shark,whale,dolphin,seal,orca,otter,walrus;snake,lizard,crocodile,gecko,turtle,frog,toad;butterfly,moth,bee,wasp,beetle,dragonfly,ant;horse,donkey,zebra,mule,camel,llama;cow,buffalo,goat,sheep,deer,bison",

Music:"guitar,bass,banjo,ukulele,violin,cello,harp;flute,clarinet,trumpet,saxophone,trombone,oboe;drum,bongo,tambourine,xylophone,cymbal;rock,metal,jazz,blues,pop,rap,country,reggae;singer,composer,conductor,pianist,drummer,rapper",
Tech:"phone,tablet,laptop,desktop,smartwatch,console;mouse,trackpad,keyboard,monitor,webcam,headset;router,modem,server,cable,antenna;printer,scanner,projector,camera,camcorder;email,chat,video call,voicemail,podcast",
Clothing:"shirt,blouse,sweater,hoodie,vest,jacket,coat;pants,jeans,shorts,leggings,skirt,dress;shoes,boots,sandals,sneakers,slippers,heels;hat,cap,beanie,helmet,turban,scarf;watch,bracelet,necklace,ring,earrings,belt",
Jobs:"doctor,nurse,surgeon,dentist,pharmacist,paramedic;teacher,professor,tutor,principal,librarian;lawyer,judge,police,detective,soldier,guard;painter,sculptor,singer,actor,dancer,writer,poet;plumber,electrician,carpenter,mechanic,welder,tailor;chef,baker,waiter,farmer,fisherman,butcher",
Home:"sofa,chair,stool,bench,bed,table,desk;spoon,fork,knife,ladle,whisk,spatula;lamp,candle,torch,lantern,chandelier;pillow,blanket,quilt,curtain,carpet,rug;hammer,screwdriver,wrench,drill,saw,pliers;soap,shampoo,towel,toothbrush,razor,comb",
Fantasy:"dragon,unicorn,griffin,phoenix,pegasus,hydra;wizard,witch,sorcerer,druid,alchemist;vampire,werewolf,zombie,ghost,mummy,skeleton;king,queen,prince,emperor,knight,baron;elf,dwarf,goblin,troll,ogre,giant;sword,shield,spear,axe,bow,dagger",
Places:"hospital,clinic,school,college,library,museum;bank,market,mall,pharmacy,bakery,cinema;paris,london,rome,madrid,berlin,vienna,athens;tokyo,seoul,beijing,delhi,karachi,dubai,bangkok;airport,station,harbor,bridge,tunnel,highway;beach,island,desert,jungle,forest,cave",
School:"pen,pencil,marker,crayon,eraser,ruler;math,physics,chemistry,biology,history,geography;notebook,textbook,diary,journal,magazine,novel;exam,quiz,homework,project,lecture,assignment;classroom,laboratory,cafeteria,playground,hallway",
Body:"eye,ear,nose,mouth,tongue,cheek;arm,elbow,wrist,hand,finger,thumb;leg,knee,ankle,foot,toe,heel;heart,lung,liver,kidney,stomach,brain;skin,hair,nail,bone,muscle,vein",
Feelings:"happy,joyful,cheerful,excited,proud;sad,lonely,gloomy,heartbroken,tired;angry,furious,annoyed,jealous,bitter;brave,bold,fearless,heroic;kind,gentle,polite,generous,humble;fear,panic,worry,anxiety,dread",
Games:"chess,checkers,ludo,monopoly,scrabble,carrom;poker,blackjack,rummy,bridge,solitaire;puzzle,riddle,maze,quiz,crossword;lego,doll,kite,marbles,yoyo,balloon;racing,shooter,platformer,sandbox,strategy,adventure",
Space:"sun,moon,star,comet,asteroid,meteor;mercury,venus,earth,mars,jupiter,saturn,neptune;galaxy,nebula,blackhole,universe,orbit;astronaut,satellite,telescope,spaceship,rover,shuttle",
Kitchen:"salt,pepper,cumin,turmeric,cinnamon,paprika;basil,mint,parsley,thyme,coriander,oregano;ketchup,mayo,mustard,vinegar,chutney,salsa;oven,stove,microwave,toaster,grill,blender;cup,mug,glass,bottle,jug,flask;plate,bowl,tray,pan,pot,kettle",
Money:"cash,coin,cheque,card,wallet,purse;bank,vault,locker,safe,treasury;salary,bonus,pension,tax,loan,debt;gold,silver,diamond,pearl,ruby,emerald;shop,store,stall,booth,kiosk,warehouse",
Media:"movie,drama,series,cartoon,documentary,sitcom;novel,comic,poem,biography,story,fable;painting,sketch,poster,mural,portrait,sculpture;radio,television,newspaper,magazine,website;comedy,horror,thriller,romance,mystery,fantasy",
Colors:"red,crimson,scarlet,maroon,pink;blue,navy,cyan,teal,indigo;green,lime,olive,emerald,mint;yellow,gold,amber,orange,mustard;circle,square,triangle,oval,diamond,star"
};
const CATS=Object.entries(WORDS).map(([c,s])=>[c,s.split(";").map(g=>g.split(","))]);
const DEF={master:.8,sfx:.8,music:.35,mute:false,disc:120,clue:20,under:1,white:1,guess:true,showRole:true,hold:true,vib:true,wake:true,theme:"auto",size:16,rm:false,hc:false,anim:true,cats:null,custom:"",names:["","","","",""],scores:{}};
const $=s=>document.querySelector(s),rnd=n=>Math.floor(Math.random()*n);
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let set;try{set=Object.assign({},DEF,JSON.parse(lsGet("mw_set")||"{}"))}catch(e){set={...DEF}}
const save=()=>lsSet("mw_set",JSON.stringify(set));
function h(t,a={},...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==="class")e.className=v;else if(x.startsWith("on"))e.addEventListener(x.slice(2),v);else if(x==="style")e.style.cssText=v;else e.setAttribute(x,v)}for(const c of k.flat())if(c!=null)e.append(c);return e}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const col=i=>`hsl(${(i*47+12)%360} 72% 48%)`;
const av=(i,t,big)=>h("div",{class:"av"+(big?" big":""),style:"background:"+col(i)},t);
const RN={civ:"Civilian",und:"Undercover",wht:"Mr. White"};
const tag=r=>h("span",{class:"tag t-"+r},RN[r]);
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function toast(m){const t=h("div",{class:"toast"},m);document.body.append(t);setTimeout(()=>t.remove(),2600)}
const vib=ms=>{if(set.vib&&navigator.vibrate)navigator.vibrate(ms)};

/* ---------- audio (Web Audio, all gains live) ---------- */
let AC,mG,sG,uG,mi;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();mG=AC.createGain();sG=AC.createGain();uG=AC.createGain();sG.connect(mG);uG.connect(mG);mG.connect(AC.destination);applyVol()}if(AC.state==="suspended")AC.resume();return AC}
function applyVol(){if(!AC)return;const t=AC.currentTime;mG.gain.setTargetAtTime(set.mute?0:set.master,t,.02);sG.gain.setTargetAtTime(set.sfx,t,.02);uG.gain.setTargetAtTime(set.music,t,.02)}
function tone(f,d,type,dest,delay,v){try{const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(delay||0);o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest==="m"?uG:sG);o.start(t);o.stop(t+d+.05)}catch(e){}}
const sfx={click:()=>tone(660,.07,"square","s",0,.12),reveal:()=>{tone(523,.15,"sine","s",0,.3);tone(784,.25,"sine","s",.1,.3)},good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle","s",i*.12,.3)),bad:()=>[330,262,196].forEach((f,i)=>tone(f,.3,"sawtooth","s",i*.15,.2)),tick:()=>tone(880,.05,"square","s",0,.1)};
function music(on){clearInterval(mi);if(on){let i=0;const sc=[262,330,392,523,392,330];mi=setInterval(()=>tone(sc[i++%6],.5,"triangle","m",0,.2),420)}}
document.addEventListener("click",e=>{if(e.target.closest("button")){sfx.click();vib(10)}});

/* ---------- timer ---------- */
const tm={left:0,on:false,last:0,cb:null,ls:0};
function tmSet(s,cb){tm.left=s;tm.cb=cb;tm.on=s>0;tm.last=Date.now();tm.ls=0}
function upd(){const e=$("#clk");if(e){e.textContent=fmt(Math.ceil(tm.left));e.classList.toggle("low",tm.left<=10&&tm.on)}}
setInterval(()=>{if(!tm.on)return;const n=Date.now();tm.left-=(n-tm.last)/1000;tm.last=n;if(tm.left<=0){tm.left=0;tm.on=false;upd();tm.cb&&tm.cb();return}const s=Math.ceil(tm.left);if(s<=10&&s!==tm.ls){tm.ls=s;sfx.tick()}upd()},250);

/* ---------- display ---------- */
function applyDisplay(){document.documentElement.style.fontSize=set.size+"px";if(set.theme==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=set.theme;document.body.classList.toggle("rm",set.rm||matchMedia("(prefers-reduced-motion:reduce)").matches);document.body.classList.toggle("hc",set.hc);document.body.classList.toggle("calm",!set.anim)}
function wake(){if(set.wake&&navigator.wakeLock)navigator.wakeLock.request("screen").catch(()=>{})}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&G)wake()});

/* ---------- words ---------- */
function customPairs(){return set.custom.split("\n").map(l=>l.split(/[,|]/).map(x=>x.trim().toUpperCase())).filter(p=>p.length>=2&&p[0]&&p[1])}
function pairCount(){const on=CATS.filter(([c])=>!set.cats||set.cats.includes(c));return on.reduce((s,[,gs])=>s+gs.reduce((a,g)=>a+g.length*(g.length-1)/2,0),0)+customPairs().length}
function pickPair(){let used;try{used=JSON.parse(lsGet("mw_used")||"[]")}catch(e){used=[]}
const us=new Set(used),on=CATS.filter(([c])=>!set.cats||set.cats.includes(c)),cu=customPairs(),pool=(on.length?on:CATS).flatMap(([,g])=>g);let p,k;
for(let i=0;i<120;i++){if(cu.length&&Math.random()<cu.length/(cu.length+40))p=cu[rnd(cu.length)].slice(0,2);else{const g=pool[rnd(pool.length)],a=rnd(g.length);let b=rnd(g.length-1);if(b>=a)b++;p=[g[a],g[b]].map(w=>w.toUpperCase())}k=[...p].sort().join("|");if(!us.has(k))break}
used.push(k);lsSet("mw_used",JSON.stringify(used.slice(-3000)));return p}

/* ---------- game ---------- */
let G=null,scr="home",back="home",wasOn=false,sel=null;
function go(s){scr=s;render()}
function start(){const names=set.names.map((n,i)=>n.trim()||"Player "+(i+1));
if(names.length<3)return toast("At least 3 players are needed");
if(new Set(names.map(n=>n.toLowerCase())).size<names.length)return toast("Player names must be unique");
const n=names.length,mx=Math.floor((n-1)/2);let w=Math.min(set.white,mx),u=Math.min(set.under,mx-w);if(!w&&!u)u=1;
const pair=pickPair(),roles=shuffle([...Array(u).fill("und"),...Array(w).fill("wht"),...Array(n-u-w).fill("civ")]);
G={P:names.map((nm,i)=>({name:nm,color:col(i),idx:i,role:roles[i],alive:true,word:roles[i]==="civ"?pair[0]:roles[i]==="und"?pair[1]:null})),civ:pair[0],und:pair[1],round:1,i:0,tied:null};
wake();go("cover")}
function startClues(){const al=G.P.filter(p=>p.alive);G.order=shuffle([...al]);if(G.order[0].role==="wht"&&al.length>1){const j=1+rnd(al.length-1);[G.order[0],G.order[j]]=[G.order[j],G.order[0]]}G.ci=0;music(true);beginClue();go("clue")}
function beginClue(){tmSet(set.clue,nextClue)}
function nextClue(){G.ci++;if(G.ci>=G.order.length){tmSet(set.disc,toVote);go("discuss")}else{beginClue();sfx.reveal();go("clue")}}
function toVote(){music(false);tm.on=false;G.vi=0;G.voters=G.P.filter(p=>p.alive);G.tally={};G.tied=null;go("vote")}
function resolve(){const al=G.P.filter(p=>p.alive),c=G.tally,mx=Math.max(...al.map(p=>c[p.name]||0)),tops=al.filter(p=>(c[p.name]||0)===mx);
if(tops.length>1&&!G.tied){G.tied=tops;G.tally={};G.vi=0;toast("Tie. Re-vote between "+tops.map(p=>p.name).join(", "));return go("vote")}
const out=tops[rnd(tops.length)];out.alive=false;G.out=out;G.tied=null;out.role==="civ"?sfx.bad():sfx.good();vib([80,40,80]);go("out")}
function after(){const al=G.P.filter(p=>p.alive),imp=al.filter(p=>p.role!=="civ").length,civ=al.length-imp;if(!imp)end("civ");else if(imp>=civ)end("imp");else{G.round++;startClues()}}
function end(side){G.win=side;music(false);G.P.forEach(p=>{const s=set.scores[p.name]||(set.scores[p.name]={g:0,w:0});s.g++;if((side==="civ")===(p.role==="civ"))s.w++});save();side==="civ"?sfx.good():sfx.bad();vib(200);go("end")}

/* ---------- screens ---------- */
const PH={home:"home",settings:"home",cover:"reveal",word:"reveal",clue:"clue",discuss:"discuss",vote:"vote",out:"vote",guess:"vote",end:"result"};
function render(){const app=$("#app");app.replaceChildren();document.body.dataset.ph=PH[scr];$("#gear").style.display=scr==="settings"?"none":"";app.append(SC[scr]());upd()}
const SC={
home(){const c=h("div",{class:"card"},h("h1",{},"Mr. White"),h("p",{class:"m"},"Pass-and-play word deduction. Add 3 to 20 players, then find the imposters."));
set.names.forEach((n,i)=>{const inp=h("input",{placeholder:"Player "+(i+1),maxlength:16});inp.value=n;inp.oninput=()=>{set.names[i]=inp.value;save()};
